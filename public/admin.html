<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enquiry Inbox — Anusha Tiwari</title><link rel="stylesheet" href="/theme.css"><style>
body{background:#f3eee6}.admin-wrap{max-width:1120px;margin:0 auto;padding:42px 24px}.admin-top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}.admin-top h1{font:500 38px var(--serif);margin:6px 0}.admin-card{background:var(--paper);border:1px solid var(--line);padding:22px;box-shadow:var(--shadow);overflow:auto}.stats{display:flex;gap:12px;margin:22px 0}.stat{background:var(--paper);padding:16px 20px;border:1px solid var(--line);min-width:130px}.stat strong{display:block;font:500 28px var(--serif)}.stat span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}table{border-collapse:collapse;width:100%;min-width:760px;text-align:left}th{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:var(--brown);padding:12px;border-bottom:1px solid var(--line)}td{padding:14px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}td small{display:block;color:var(--muted);margin-top:4px;max-width:300px;white-space:normal}.status-select{border:1px solid var(--line);padding:7px;background:#fffdfa;color:var(--ink)}.delete-btn{border:0;background:none;color:#9b3d31;cursor:pointer;font-size:11px}.admin-msg{color:var(--muted);font-size:13px}.back-link{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--brown)}@media(max-width:600px){.admin-wrap{padding:25px 16px}.admin-top{align-items:flex-start;flex-direction:column}.stats{flex-wrap:wrap}}
</style></head><body>
<div class="admin-wrap">
  <div class="admin-top"><div><div class="eyebrow">Private owner area</div><h1>Enquiry inbox</h1><p class="admin-msg">Messages sent through your portfolio contact form.</p></div><a class="back-link" href="/">← View portfolio</a></div>
  <div class="stats"><div class="stat"><strong id="total">—</strong><span>Total enquiries</span></div><div class="stat"><strong id="newCount">—</strong><span>New enquiries</span></div></div>
  <div class="admin-card"><p class="admin-msg" id="message">Loading enquiries…</p><table id="leadsTable" hidden><thead><tr><th>Received</th><th>Contact</th><th>Enquiry type</th><th>Message</th><th>Status</th><th></th></tr></thead><tbody id="leadsBody"></tbody></table></div>
</div>
<script>
const statusOptions=['New','Contacted','In Discussion','Converted','Not Interested'];
const msg=document.getElementById('message');
async function api(path,options={}){const r=await fetch(path,{redirect:'manual',...options});if(r.status===401){const j=await r.json().catch(()=>({}));location.href=j.login_url||'https://hatchable.com/console/login';return null;}if(r.type==='opaqueredirect'){location.href='https://hatchable.com/console/login';return null;}if(r.status===403){throw new Error('This inbox is available only to the project owner.');}const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed.');return j;}
function cell(text){const el=document.createElement('td');el.textContent=text||'';return el;}
async function load(){try{const data=await api('/api/admin/leads');if(!data)return;const leads=data.leads||[];document.getElementById('total').textContent=leads.length;document.getElementById('newCount').textContent=leads.filter(x=>x.status==='New').length;const body=document.getElementById('leadsBody');body.replaceChildren();document.getElementById('leadsTable').hidden=!leads.length;msg.textContent=leads.length?'':'No enquiries yet. New messages will appear here.';
for(const lead of leads){const tr=document.createElement('tr');const date=new Date(lead.created_at).toLocaleString();tr.append(cell(date));const contact=cell(lead.name);const email=document.createElement('small');email.textContent=lead.email;contact.append(email);tr.append(contact);tr.append(cell(lead.interest));const content=cell(lead.message);content.style.maxWidth='340px';content.style.whiteSpace='pre-wrap';tr.append(content);const statusCell=document.createElement('td');const select=document.createElement('select');select.className='status-select';statusOptions.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;o.selected=s===lead.status;select.append(o);});select.addEventListener('change',async()=>{try{await api('/api/admin/leads',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:lead.id,status:select.value})});load();}catch(e){alert(e.message);}});statusCell.append(select);tr.append(statusCell);const action=cell('');const del=document.createElement('button');del.className='delete-btn';del.textContent='Delete';del.addEventListener('click',async()=>{if(!confirm('Delete this enquiry permanently?'))return;try{await api('/api/admin/leads',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:lead.id})});load();}catch(e){alert(e.message);}});action.append(del);tr.append(action);body.append(tr);}
}catch(e){msg.textContent=e.message;}}
load();
</script></body></html>
